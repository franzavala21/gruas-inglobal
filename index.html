<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Inglobal Servicios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: cabecera oscura con franja de señalización, navegación por pestañas, vistas de trabajo a ancho completo.
   Color: acero (neutros azulados), azul acero como acento de acción, ámbar de señalización solo para estados de espera. */
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --surface2:#F4F6F7; --line:#D3DADF; --ink:#17212B; --muted:#586673;
  --accent:#1B5E8C; --accent-ink:#FFFFFF; --accent-soft:#DCEAF4;
  --signal:#E9A400; --brand:#17212B; --brand-ink:#FFFFFF; --brand-line:#2B3946; --brand-edge:#3A4D60; --side-ink:#D3DCE4; --side-muted:#8E9BA8; --on-signal:#17212B;
  --ok:#2E7D4F; --ok-bg:#E1F1E7; --warn:#9A5B00; --warn-bg:#FFF0CF; --bad:#B3392F; --bad-bg:#FBE3E0;
  --map-bg:#E9ECE4; --map-hill:#D6DECB; --map-road:#D59D58; --map-water:#B4D1E5; --map-city:#DADFE4; --map-text:#46515C;
  --paper:#FFFFFF; --paper-ink:#1B1B1B; --paper-line:#C9C9C9;
  --f-head:'Barlow Condensed','Arial Narrow',sans-serif; --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10171D; --surface:#17212A; --surface2:#1D2A35; --line:#2D3C49; --ink:#E7ECF0; --muted:#97A5B1;
  --accent:#6FB3E3; --accent-ink:#0B1A26; --accent-soft:#1B3445;
  --signal:#F2B73A; --brand:#0C1217; --brand-line:#243240;
  --ok:#6CCB91; --ok-bg:#15301F; --warn:#F0B35A; --warn-bg:#392A0E; --bad:#F08A80; --bad-bg:#3A1B18; --map-bg:#18222A; --map-hill:#1F2C26; --map-road:#8C6C40; --map-water:#1E3A4F; --map-city:#24303B; --map-text:#A9B5C0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10171D; --surface:#17212A; --surface2:#1D2A35; --line:#2D3C49; --ink:#E7ECF0; --muted:#97A5B1;
  --accent:#6FB3E3; --accent-ink:#0B1A26; --accent-soft:#1B3445;
  --signal:#F2B73A; --brand:#0C1217; --brand-line:#243240;
  --ok:#6CCB91; --ok-bg:#15301F; --warn:#F0B35A; --warn-bg:#392A0E; --bad:#F08A80; --bad-bg:#3A1B18; --map-bg:#18222A; --map-hill:#1F2C26; --map-road:#8C6C40; --map-water:#1E3A4F; --map-city:#24303B; --map-text:#A9B5C0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-head);margin:0;font-weight:600;text-wrap:balance}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-size:.9em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* cabecera */
.top{background:var(--brand);color:var(--brand-ink);position:relative}
.top::after{content:"";display:block;height:6px;background:repeating-linear-gradient(135deg,var(--signal) 0 12px,var(--brand) 12px 24px)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-block:14px 0}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;min-width:0}
.brand b{font-family:var(--f-head);font-size:28px;letter-spacing:.14em;font-weight:700}
.brand span{font-family:var(--f-head);font-size:18px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.tag{font-family:var(--f-head);font-size:13px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--signal);color:var(--signal);padding:1px 8px;border-radius:3px}
.who{margin-left:auto;display:flex;align-items:center;gap:8px}
.who label{font-size:13px;opacity:.75}
.who select{background:var(--brand-line);color:var(--brand-ink);border:1px solid #455667;border-radius:6px;padding:7px 10px;min-height:40px}
.who select option{background:var(--surface);color:var(--ink)}
.nav{display:flex;gap:2px;overflow-x:auto;padding-top:10px;scrollbar-width:thin}
.nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--brand-ink);opacity:.72;padding:10px 14px;font-family:var(--f-head);font-size:18px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;white-space:nowrap;min-height:44px}
.nav button:hover{opacity:1}
.nav button[aria-current="page"]{opacity:1;border-bottom-color:var(--signal)}
.demo-note{background:var(--surface2);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.demo-note .wrap{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;padding-block:7px}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0}

main.wrap{padding-block:24px 56px}
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;margin-bottom:16px}
.page-h h1{font-size:34px;line-height:1.05}
.page-h .sp{flex:1}
.sub{color:var(--muted);margin:2px 0 0}

/* botones y chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 14px;min-height:40px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-family:var(--f-head);font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;background:var(--surface2);border:1px solid var(--line);color:var(--ink)}
.chip.w{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.chip.b{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.g{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.chip.r{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:20px;letter-spacing:.03em;text-transform:uppercase}
.card-b{padding:16px}

/* panel */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tile:hover{border-color:var(--accent)}
.tile .n{font-family:var(--f-head);font-size:46px;line-height:1;font-weight:600}
.tile .l{font-weight:600}
.tile .d{font-size:13px;color:var(--muted)}
.tile.hot .n{color:var(--warn)}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.todo{display:flex;flex-direction:column}
.todo button{display:flex;gap:12px;align-items:center;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 16px;cursor:pointer;width:100%}
.todo button:first-child{border-top:0}
.todo button:hover{background:var(--surface2)}
.todo .t{flex:1;min-width:0}
.todo .t b{display:block}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:150px 1fr 28px;gap:10px;align-items:center;font-size:14px}
.bar i{display:block;height:10px;background:var(--surface2);border-radius:2px;position:relative;overflow:hidden}
.bar i u{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:2px}
.route{display:grid;gap:8px}
.route button{text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer}
.route button:hover{border-color:var(--accent)}
.route b{display:block}
.route span{font-size:13px;color:var(--muted)}

/* lista de servicios */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.fchip{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:14px;min-height:34px}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.list{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lrow{display:grid;grid-template-columns:84px minmax(0,2.3fr) 96px 170px minmax(0,1.2fr) 120px;gap:12px;align-items:center;padding:12px 16px;border:0;border-top:1px solid var(--line);background:var(--surface);width:100%;text-align:left;cursor:pointer}
.lrow:hover{background:var(--surface2)}
.lhead{background:var(--surface2);cursor:default;font-family:var(--f-head);text-transform:uppercase;letter-spacing:.06em;font-size:14px;color:var(--muted);border-top:0}
.lhead:hover{background:var(--surface2)}
.lrow .c-main{min-width:0}
.lrow .c-main b{display:block;overflow-wrap:anywhere}
.lrow .c-main span{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.c-money{text-align:right}
.empty{padding:28px 16px;color:var(--muted);text-align:center}
.search{flex:1;min-width:200px;max-width:340px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-height:40px}

/* detalle */
.crumb{margin-bottom:10px}
.steps{display:grid;grid-template-columns:repeat(8,minmax(88px,1fr));gap:4px;overflow-x:auto;padding-bottom:6px;margin:14px 0 16px}
.step{border-top:6px solid var(--line);padding-top:6px;font-family:var(--f-head);font-size:15px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);line-height:1.1}
.step.done{border-top-color:var(--accent);color:var(--ink)}
.step.now{border-top-color:var(--signal);color:var(--ink);font-weight:700}
.next{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--signal);border-radius:8px;padding:14px 16px;margin-bottom:16px}
.next .tx{flex:1;min-width:220px}
.next .tx b{display:block;font-family:var(--f-head);font-size:20px;letter-spacing:.03em;text-transform:uppercase}
.next .bt{display:flex;flex-wrap:wrap;gap:8px}
.dgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.ver{border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface2)}
.ver+.ver{margin-top:10px}
.ver-h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.ver-h b{font-family:var(--f-head);font-size:20px}
.ver-h .tot{margin-left:auto;font-weight:600}
.quote{border-left:3px solid var(--line);padding:4px 0 4px 12px;margin:0;color:var(--ink)}
.file{font-family:var(--f-mono);font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{padding:9px 0 9px 16px;border-left:2px solid var(--line);position:relative}
.tl li::before{content:"";position:absolute;left:-6px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.tl li:first-child::before{border-color:var(--signal);background:var(--signal)}
.tl small{color:var(--muted);display:block}
.callout{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:10px 12px;font-size:14px}
.callout.bad{background:var(--bad-bg);color:var(--bad)}
.callout.ok{background:var(--ok-bg);color:var(--ok)}
.callout.info{background:var(--accent-soft);color:var(--accent)}

/* agenda */
.week{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.wgrid{display:grid;grid-template-columns:170px repeat(6,minmax(140px,1fr));min-width:1020px}
.wgrid>div{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:6px;min-height:78px;display:flex;flex-direction:column;gap:5px}
.wgrid>div:nth-child(7n+1){border-left:0}
.wgrid .hd{min-height:0;font-family:var(--f-head);text-transform:uppercase;letter-spacing:.05em;font-size:16px;background:var(--surface2);border-top:0}
.wgrid .hd.today{background:var(--accent-soft);color:var(--accent);font-weight:700}
.wgrid .eq{background:var(--surface2);justify-content:center}
.wgrid .eq b{font-family:var(--f-head);font-size:18px}
.wgrid .eq span{font-size:13px;color:var(--muted)}
.slot{text-align:left;border:1px solid var(--line);border-left:5px solid var(--accent);background:var(--surface);border-radius:4px;padding:5px 7px;cursor:pointer;font-size:13px;line-height:1.25}
.slot:hover{border-color:var(--accent)}
.slot b{display:block;font-family:var(--f-mono);font-weight:500;font-size:12px}
.slot.clash{border-left-color:var(--bad);background:var(--bad-bg)}
.slot.fin{border-left-color:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin:10px 0 16px}

/* administración */
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:11px 14px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
th{border-top:0;background:var(--surface2);font-family:var(--f-head);text-transform:uppercase;letter-spacing:.06em;font-size:14px;color:var(--muted);font-weight:600}

/* alcance */
.scope{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.scope ul{margin:0;padding-left:18px;display:grid;gap:6px}

/* shell tipo sistema: ingreso, menú lateral, buscador, fichas */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.logo{width:40px;height:40px;border-radius:8px;background:var(--signal);color:var(--on-signal);display:grid;place-items:center;flex:none}
.logo svg{width:26px;height:26px}
#login{background:var(--brand);color:var(--brand-ink);min-height:100vh}
.login{max-width:1000px;margin:0 auto;padding-block:40px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:18px}
.lbrand{display:flex;gap:12px;align-items:center}
.lbrand b{font-family:var(--f-head);font-size:30px;letter-spacing:.14em;font-weight:700;display:block;line-height:1}
.lbrand small{display:block;color:var(--side-muted);margin-top:3px}
.login h1{font-size:46px;margin-top:6px}
.lform{width:100%;max-width:380px;background:var(--brand-line);border:1px solid var(--brand-edge);border-radius:10px;padding:20px;display:grid;gap:14px}
.lform .fld input{background:var(--brand);border-color:var(--brand-edge);color:var(--brand-ink)}
.lform .fld label{color:var(--brand-ink)}
.btn.big{min-height:46px;width:100%;background:var(--signal);border-color:var(--signal);color:var(--on-signal);font-weight:700;font-size:16px}
.lhint{color:var(--side-muted);margin:0;text-align:center}
.lhint b{color:var(--brand-ink)}
.lerr{color:var(--on-signal);background:var(--signal);border-radius:6px;padding:8px 10px;font-size:14px}
.ucards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:12px;width:100%}
.ucard{text-align:left;background:var(--brand-line);border:1px solid var(--brand-edge);border-radius:10px;padding:16px;color:var(--brand-ink);cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ucard:hover{border-color:var(--signal)}
.av{width:38px;height:38px;border-radius:50%;background:var(--signal);color:var(--on-signal);display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:18px;flex:none}
.ucard b{font-family:var(--f-head);font-size:24px;font-weight:600}
.rchip{font-size:12px;font-weight:600;color:var(--signal);border:1px solid var(--signal);border-radius:99px;padding:1px 9px}
.ud{color:var(--side-muted);font-size:14px}
.un{color:var(--signal);font-size:13px;font-weight:600}
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
#shell[hidden],#login[hidden],#drawer[hidden],.sres[hidden]{display:none!important}
.side{background:var(--brand);color:var(--brand-ink);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding-left:env(safe-area-inset-left,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sbrand{display:flex;gap:10px;align-items:center;padding:18px 16px 14px;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.sbrand b{font-family:var(--f-head);font-size:22px;letter-spacing:.14em;display:block;line-height:1}
.sbrand small{color:var(--side-muted);font-size:13px}
.stripe{height:6px;background:repeating-linear-gradient(135deg,var(--signal) 0 12px,var(--brand) 12px 24px);flex:none}
.snav{display:flex;flex-direction:column;gap:2px;padding:12px 10px;flex:1}
.snav button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--side-ink);padding:10px 12px;border-radius:6px;font-weight:500;font-size:15px;cursor:pointer;text-align:left;min-height:44px}
.snav button:hover{background:var(--brand-line);color:var(--brand-ink)}
.snav button.on{background:var(--brand-line);color:var(--brand-ink);box-shadow:inset 3px 0 0 var(--signal);font-weight:600}
.cnt{margin-left:auto;background:var(--signal);color:var(--on-signal);border-radius:99px;padding:0 8px;font-size:12px;font-weight:700;line-height:20px}
.suser{display:flex;align-items:center;gap:10px;padding:14px 16px;border-top:1px solid var(--brand-edge)}
.suser b{display:block;font-size:14px}
.suser small{display:block;color:var(--side-muted);font-size:12px}
.btn.ghost{background:transparent;border-color:var(--brand-edge);color:var(--brand-ink);margin-left:auto}
.btn.ghost .ic{width:16px;height:16px}
.scrim{display:none;position:fixed;inset:0;background:rgba(8,14,19,.55);z-index:45}
.mainc{min-width:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:12px;padding-block:10px}
.iconbtn{display:none;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;flex:none}
.search{position:relative;flex:1;max-width:680px}
.search>.ic{position:absolute;left:12px;top:12px;color:var(--muted);pointer-events:none}
.search input{width:100%;min-height:44px;padding:8px 12px 8px 42px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.sres{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.2);max-height:65vh;overflow-y:auto;z-index:30}
.sres button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 14px;cursor:pointer}
.sres button:first-child{border-top:0}
.sres button:hover{background:var(--surface2)}
.sres .k{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--muted);width:68px;flex:none}
.sres .t{flex:1;min-width:0}
.sres .t b{display:block;overflow-wrap:anywhere}
.sres .t span{color:var(--muted);font-size:13px}
.sec{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.08em;font-size:16px;color:var(--muted);font-weight:600;margin:22px 0 10px}
.tiles2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.tile2{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile2:hover{border-color:var(--accent)}
.tile2 .th{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--muted)}
.ib{width:34px;height:34px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.ib .ic{width:18px;height:18px}
.tile2 .n{font-family:var(--f-head);font-size:38px;line-height:1.05;font-weight:600;overflow-wrap:anywhere}
.tile2 .n.warn{color:var(--warn)}
.tile2 .n.bad{color:var(--bad)}
.tile2 .d{font-size:13px;color:var(--muted)}
.eqstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line)}
.eqstats>div{padding:12px 16px;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.eqstats>div:first-child{border-left:0}
.eqstats .n{font-family:var(--f-head);font-size:32px;line-height:1;font-weight:600}
.eqstats span:last-child{font-size:13px;color:var(--muted)}
#drawer{position:fixed;inset:0;z-index:55}
#drawer .backdrop{position:absolute;inset:0;background:rgba(8,14,19,.55)}
.dpanel{position:absolute;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--bg);overflow-y:auto;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));box-shadow:-12px 0 40px rgba(0,0,0,.25)}
.dhead{display:flex;justify-content:flex-end;margin-bottom:6px}
.dpanel .page-h h1{font-size:30px}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(290px,86vw);z-index:50;transform:translateX(-100%);transition:transform .2s;height:auto}
  .side.open{transform:none}
  .scrim.open{display:block}
  .iconbtn{display:inline-flex}
}
@media (max-width:520px){.eqstats{grid-template-columns:repeat(2,minmax(0,1fr))}.eqstats>div:nth-child(3){border-left:0}.eqstats>div:nth-child(n+3){border-top:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){.side{transition:none}}

.lmap{position:relative;z-index:0;height:clamp(380px,62vh,640px);width:100%;background:var(--map-bg)}
.lf-ic{position:relative}
.lf-ic .pin{display:block;width:22px;height:22px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.35);background:var(--muted)}
.lf-ic .pin.t-b{background:var(--accent)}.lf-ic .pin.t-w{background:var(--warn)}.lf-ic .pin.t-g{background:var(--ok)}
.lf-ic .pin.today{outline:2.5px dashed var(--accent);outline-offset:4px}
.lf-ic .bx{display:block;width:22px;height:22px;border-radius:4px;background:var(--signal);border:3px solid var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.lf-ic .lbl{position:absolute;left:28px;top:-2px;white-space:nowrap;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;line-height:1.35;font-family:var(--f-body);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.lf-ic .lbl.id{font-family:var(--f-mono);font-weight:500}
.lf-ic .eqb{position:absolute;left:-14px;top:-28px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-size:12px;font-weight:500;padding:1px 6px;border-radius:4px;white-space:nowrap}

/* mapa */
.mapgrid .todo button{flex-direction:column;align-items:flex-start;gap:6px}
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.mapcard{overflow:hidden}
.map{display:block;width:100%;height:auto;max-width:100%}
.m-bg{fill:var(--map-bg)}.m-hill{fill:var(--map-hill)}.m-water{fill:var(--map-water)}.m-city{fill:var(--map-city)}
.m-road{fill:none;stroke:var(--map-road);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.m-ring{fill:none;stroke:var(--map-road);stroke-width:3;stroke-dasharray:2 0}
.m-lb{fill:var(--map-text);font-family:var(--f-body);font-size:17px;paint-order:stroke;stroke:var(--map-bg);stroke-width:4px;stroke-linejoin:round}
.m-lb.big{font-family:var(--f-head);font-size:24px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.m-lb.sm{font-size:14px}.m-lb.it{font-style:italic;font-size:16px}.m-lb.strong{font-weight:600;fill:var(--ink)}
.mk{cursor:pointer}
.mk circle{stroke:var(--surface);stroke-width:3}
.mk:hover circle:not(.m-today){stroke:var(--ink)}
.m-today{fill:none;stroke:var(--accent)!important;stroke-width:2.5!important;stroke-dasharray:4 3}
.m-id{fill:var(--ink);font-family:var(--f-mono);font-size:16px;font-weight:500;paint-order:stroke;stroke:var(--map-bg);stroke-width:4px;stroke-linejoin:round}

function byId(id){return S.filter(function(s){return s.id===id})[0]}
function lastV(s){return s.versiones[s.versiones.length-1]}
function accepted(s){var a=s.versiones.filter(function(v){return v.resp&&v.resp.conforme});return a[a.length-1]}
function canMoney(){return role!=='operario'}
function mine(s){return role==='operario'?!!(s.asign&&s.asign.operarios.indexOf(ROLES.operario.opId)>-1):true}
function isForMe(s){
  if(role==='operario')return s.estado==='coordinada'&&mine(s);
  if(role==='direccion')return false;
  if(s.estado==='pendiente_admin'&&s.admin&&s.admin.estado==='facturado')return false;
  if(s.estado==='enviada')return false;
  return OWNER[s.estado]===role;
}
function respNow(s){
  if(s.estado==='pendiente_admin'&&s.admin&&s.admin.estado==='facturado')return'Facturado';
  if(s.estado==='enviada')return'Cliente (respuesta)';
  return ROLES[OWNER[s.estado]].n;
}
function addHist(s,txt){s.hist.push({t:stamp(),quien:ROLES[role].user,rol:ROLES[role].n,txt:txt})}
function toast(m){var t=document.getElementById('toast');t.innerHTML='<div>'+esc(m)+'</div>';clearTimeout(toast.h);toast.h=setTimeout(function(){t.innerHTML=''},3600)}
function conflicts(sid,eq,ops,fecha,hora,dur){
  var a0=toMin(hora),a1=a0+Math.round(dur*60),out=[];
  S.forEach(function(o){
    if(o.id===sid||!o.asign||(o.estado!=='coordinada'&&o.estado!=='ejecutada')||o.fecha!==fecha)return;
    var b0=toMin(o.hora),b1=b0+Math.round(o.durH*60);
    if(!(a0<b1&&b0<a1))return;
    if(o.asign.equipoId===eq)out.push('El equipo '+eq+' ya está reservado por '+o.id+' ('+cl(o.cid).n+') de '+o.hora+' a '+endT(o)+'.');
    ops.forEach(function(p){if(o.asign.operarios.indexOf(p)>-1)out.push(OPS[p]+' ya está asignado a '+o.id+' de '+o.hora+' a '+endT(o)+'.')});
  });
  return out;
}
function clashIds(){
  var ids={},a=S.filter(function(s){return s.asign});
  for(var i=0;i<a.length;i++)for(var j=i+1;j<a.length;j++){
    var x=a[i],y=a[j];if(x.fecha!==y.fecha)continue;
    var x0=toMin(x.hora),x1=x0+Math.round(x.durH*60),y0=toMin(y.hora),y1=y0+Math.round(y.durH*60);
    if(x0<y1&&y0<x1){
      var sameEq=x.asign.equipoId===y.asign.equipoId,sameOp=x.asign.operarios.some(function(p){return y.asign.operarios.indexOf(p)>-1});
      if(sameEq||sameOp){ids[x.id]=1;ids[y.id]=1}
    }
  }
  return ids;
}

function worst(docs,ref){var o={vigente:0,por_vencer:1,vencido:2},w='vigente';docs.forEach(function(d){var s=dstat(d.v,ref);if(o[s]>o[w])w=s});return w}

function legajoSections(s){

  function dr(d){return[d.t,'vence '+fdate(d.v)+' · '+DST[dstat(d.v,ref)][1].toLowerCase()+' a la fecha del servicio · '+d.a]}
  out.push({g:'servicio',t:'Servicio',rows:[['Número',s.id],['Cliente',c.n],['Contacto',(acc&&acc.contacto)||c.c],['Lugar',s.lugar],['Trabajo',s.tarea],['Fecha',fd(s.fecha)+' · '+s.hora+' a '+endT(s)],['Horas realizadas',s.ejec?num(s.ejec.horas)+' h':'—']]});
  out.push({g:'cot',t:'Cotización aceptada',rows:acc?[['Documento','Cotizacion_'+s.id+'_v'+acc.n+'.docx'],['Condiciones de pago',acc.pago||PAGO0],['Respuesta del cliente',acc.resp.archivo||('Correo del '+acc.resp.fecha)]]:[['Estado','Sin conformidad registrada']]});
  out.push({g:'equipo',t:'Equipo · '+eq,rows:[['Equipo',EQ[eq].n],['Operario habitual',OPS[EQ[eq].op]]].concat(ED[eq].map(dr))});
  out.push({g:'mant',t:'Mantenimiento de '+eq,rows:ES[eq].log.slice(0,3).map(function(l){return[fdate(l.f)+' · '+l.tipo,l.desc+' ('+l.resp+')']}).concat([['Próximo preventivo',fdate(ES[eq].prox)]])});
  s.asign.operarios.forEach(function(p){out.push({g:'op',t:'Operario · '+OPS[p],rows:PD[p].map(dr)})});
  out.push({g:'ejec',t:'Ejecución y cierre',rows:s.ejec?[['Horario real',s.ejec.ini+' a '+s.ejec.fin],['Incidencias',s.ejec.incidencia||'Sin incidencias.'],['Extras',(s.cierre&&s.cierre.extras)||'—'],['Conformidad de prestación',(s.cierre&&s.cierre.conf)||'—']]:[['Estado','Sin ejecución registrada']]});
  return out;
}

function whereIs(k){
  if(ES[k].estado==='taller')return{l:'En taller',t:'En taller: '+ES[k].log[0].desc,c:'w'};
  var t=S.filter(function(s){return s.asign&&s.asign.equipoId===k&&s.fecha===TODAY&&(s.estado==='coordinada'||s.estado==='ejecutada')})[0];
  if(t)return{l:'En obra',t:'En obra: '+cl(t.cid).n+', '+t.lugar+' ('+t.hora+'–'+endT(t)+')',c:'b'};
  var nx=S.filter(function(s){return s.asign&&s.asign.equipoId===k&&s.fecha>TODAY&&s.estado==='coordinada'}).sort(function(a,b){return a.fecha<b.fecha?-1:1})[0];
  return{l:'En base',t:'En base'+(nx?'. Próximo trabajo: '+fd(nx.fecha)+' '+nx.hora+', '+cl(nx.cid).n:'. Sin trabajos próximos.'),c:'g'};
}
function whereOp(p){
  var t=S.filter(function(s){return s.asign&&s.asign.operarios.indexOf(p)>-1&&s.fecha===TODAY&&(s.estado==='coordinada'||s.estado==='ejecutada')})[0];
  if(t)return{l:'En obra',t:'En obra: '+cl(t.cid).n+', '+t.lugar+' ('+t.hora+'–'+endT(t)+')',c:'b'};
  var nx=S.filter(function(s){return s.asign&&s.asign.operarios.indexOf(p)>-1&&s.fecha>TODAY&&s.estado==='coordinada'}).sort(function(a,b){return a.fecha<b.fecha?-1:1})[0];
  return{l:'Sin trabajo hoy',t:'Sin trabajo asignado hoy'+(nx?'. Próximo: '+fd(nx.fecha)+' '+nx.hora+', '+cl(nx.cid).n:'.'),c:'g'};
}
function hideSearch(){var b=document.getElementById('sres');if(b){b.hidden=true;b.innerHTML=''}}
function updSearch(){
  var box=document.getElementById('sres'),qq=norm(document.getElementById('gsearch').value).trim();
  if(!qq){hideSearch();return}
  var R=[];
  if(role!=='operario'){
    Object.keys(EQ).forEach(function(k){if(norm(k+' '+EQ[k].n+' '+OPS[EQ[k].op]).indexOf(qq)>-1){var w=whereIs(k);R.push('<button type="button" data-res="'+k+'"><span class="k">Equipo</span><span class="t"><b>'+k+' · '+EQ[k].n+'</b><span>'+esc(w.t)+'</span></span><span class="chip '+w.c+'">'+w.l+'</span></button>')}});
    Object.keys(OPS).forEach(function(p){if(norm(OPS[p]).indexOf(qq)>-1){var w=whereOp(p);R.push('<button type="button" data-res="'+p+'"><span class="k">Persona</span><span class="t"><b>'+OPS[p]+'</b><span>'+esc(w.t)+'</span></span><span class="chip '+w.c+'">'+w.l+'</span></button>')}});
    CLIENTS.forEach(function(c){if(norm(c.n+' '+c.c).indexOf(qq)>-1){var n=S.filter(function(s){return s.cid===c.id}).length;R.push('<button type="button" data-cli="'+esc(c.n)+'"><span class="k">Cliente</span><span class="t"><b>'+esc(c.n)+'</b><span>'+esc(c.c)+' · '+n+(n===1?' servicio':' servicios')+'</span></span></button>')}});
  }
  visible().forEach(function(s){if(norm(s.id+' '+s.tarea+' '+s.lugar+' '+cl(s.cid).n).indexOf(qq)>-1)R.push('<button type="button" data-open="'+s.id+'"><span class="k">Servicio</span><span class="t"><b>'+s.id+' · '+esc(cl(s.cid).n)+'</b><span>'+esc(s.tarea)+' · '+fd(s.fecha)+'</span></span>'+chip(s)+'</button>')});
  box.innerHTML=R.length?R.slice(0,10).join(''):'<div class="empty">No hay resultados para esa búsqueda.</div>';
  box.hidden=false;
}

function prange(){
  if(period==='hoy')return[TODAY,TODAY];
  if(period==='semana'){var dw=(pd(TODAY).getDay()+6)%7,a=addDays(TODAY,-dw);return[a,addDays(a,6)]}
  var a2=TODAY.slice(0,8)+'01',d=pd(a2);d.setMonth(d.getMonth()+1);d.setDate(0);return[a2,iso(d)];
}

var mapF='prox',agMode='semana',lmap=null;
var LOC={'S-0138':[-31.37,-64.25],'S-0139':[-31.47,-64.36],'S-0140':[-31.24,-64.07],'S-0141':[-31.64,-64.41],'S-0142':[-31.47,-64.10],'S-0143':[-31.30,-64.16],'S-0144':[-31.68,-63.88],'S-0145':[-31.43,-64.15],'S-0146':'off'};

function xy(ll){return[Math.round((ll[1]+64.55)/0.75*1000),Math.round((ll[0]+31.15)/-0.60*700)]}
function pl(pts){return pts.map(function(p){var q=xy(p);return q[0]+','+q[1]}).join(' ')}
var TONEC={'':'t-n',w:'t-w',b:'t-b',g:'t-g'};
function mapShown(){
  var end=addDays(TODAY,7);

    if(mapF==='hoy')return s.fecha===TODAY;

    if(mapF==='abiertos')return s.estado!=='pendiente_admin';

  }).sort(function(a,b){return a.fecha<b.fecha?-1:a.fecha>b.fecha?1:a.hora<b.hora?-1:1});
}
var OSM_B=(function(){var n=2048;function lng(x){return x/n*360-180}function lat(y){var a=Math.PI*(1-2*y/n);return Math.atan(Math.sinh(a))*180/Math.PI}return[[lat(1215),lng(656)],[lat(1210),lng(662)]]})();

function initMap(){
  var el=document.getElementById('lmap');
  if(typeof L==='undefined'){el.innerHTML='<div class="empty">No se pudo cargar el mapa. Revisá la conexión y recargá la página.</div>';return}
  lmap=L.map(el,{maxBounds:OSM_B,maxBoundsViscosity:1,minZoom:10,maxZoom:12.5,zoomSnap:0.25});
  L.imageOverlay('osm_cba.jpg',OSM_B,{attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(lmap);
  lmap.attributionControl.setPrefix(false);
  var enBase=Object.keys(EQ).filter(function(k){return whereIs(k).c==='g'}),enTaller=Object.keys(EQ).filter(function(k){return whereIs(k).c==='w'});
  L.marker(BASE,{title:'Base Inglobal (ejemplo). En base: '+(enBase.join(', ')||'ninguno')+(enTaller.length?'. En taller: '+enTaller.join(', '):''),icon:L.divIcon({className:'lf-ic',html:'<span class="bx"></span><span class="lbl"><b>Base</b> · '+enBase.length+' equipos'+(enTaller.length?' · '+enTaller.length+' en taller':'')+'</span>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(lmap);
  var pts=[BASE];
  mapShown().forEach(function(s){
    var ll=LOC[s.id];if(!ll||ll==='off')return;pts.push(ll);
    var tone=TONEC[STONE[s.estado]],today=s.fecha===TODAY,eq=s.asign&&today&&(s.estado==='coordinada'||s.estado==='ejecutada')?s.asign.equipoId:'';

    m.on('click',function(){setTimeout(function(){open_(s.id)},0)});
  });

  setTimeout(function(){if(lmap)lmap.invalidateSize()},0);
}

function respModal(sid){
  var s=byId(sid),c=cl(s.cid);modalCtx={f:'resp',sid:sid};
  var sent=s.versiones.filter(function(v){return v.enviada});
  var h=mhead('Respuesta del cliente · '+s.id)+'<form data-form="resp"><div class="mb">'
   +'<div class="fld"><label for="r-ver">Versión a la que responde</label><select id="r-ver" name="ver">'+sent.map(function(v,i){return'<option value="'+v.n+'"'+(i===sent.length-1?' selected':'')+'>Versión '+v.n+(v.resp?' (ya tiene respuesta)':'')+'</option>'}).join('')+'</select></div>'
   +'<div class="row2"><div class="fld"><label for="r-quien">Quién responde</label><input id="r-quien" name="quien" value="'+esc(c.c)+'" required></div><div class="fld"><label for="r-fecha">Fecha de la respuesta</label><input id="r-fecha" name="fecha" type="date" value="'+TODAY+'" required></div></div>'
   +'<div class="fld"><label for="r-texto">Texto de la respuesta original</label><textarea id="r-texto" name="texto" required placeholder="Pegá acá el texto del correo del cliente"></textarea></div>'
   +'<div class="fld"><label for="r-file">Correo o captura original (opcional)</label><input id="r-file" name="file" type="file"><small>En el prototipo solo se guarda el nombre del archivo.</small></div>'
   +'<div class="fld"><span class="lb">Qué dice el cliente</span><label class="inl"><input type="radio" name="tipo" value="ok" checked> Da su conformidad</label><label class="inl"><input type="radio" name="tipo" value="cambios"> Pide cambios u observaciones</label></div>'
   +'<div class="callout info">La aceptación se carga a mano. El sistema no la interpreta como firma ni le da efecto jurídico.</div></div>'
   +'<div class="mf"><button class="btn primary" type="submit">Guardar respuesta</button></div></form>';
  modal(h);
}
function submitResp(f){
  var s=byId(modalCtx.sid),n=parseInt(f.ver.value,10),v=s.versiones.filter(function(x){return x.n===n})[0];
  var ok=f.tipo.value==='ok',file=f.file.files&&f.file.files[0]?f.file.files[0].name:'';
  var d=f.fecha.value.split('-');
  v.resp={fecha:d[2]+'/'+d[1],quien:f.quien.value,texto:f.texto.value,conforme:ok,archivo:file,reg:ROLES[role].n};
  if(ok){
    if(v===lastV(s)){s.estado='confirmada';addHist(s,'Conformidad registrada para v'+n+' ('+f.quien.value+').')}
    else addHist(s,'Conformidad registrada para v'+n+', que ya no es la versión vigente ('+lastV(s).n+'). Falta una respuesta sobre la vigente.');
  }else addHist(s,'Respuesta del cliente registrada para v'+n+': pide cambios.');
  closeModal();toast(ok&&v===lastV(s)?'Servicio confirmado. Pasa a Operaciones.':'Respuesta guardada en la versión '+n);render();
}

function coordModal(sid){
  var s=byId(sid),lv=lastV(s),re=!!s.asign;modalCtx={f:'coord',sid:sid,re:re};
  var eq=re?s.asign.equipoId:lv.eq,ops=re?s.asign.operarios:[EQ[lv.eq].op];
  var h=mhead((re?'Reprogramar o reasignar · ':'Coordinar · ')+s.id)+'<form data-form="coord" id="cf"><div class="mb">'
   +'<div class="callout info">'+esc(cl(s.cid).n)+' · '+esc(s.tarea)+'. La cotización vigente usa '+lv.eq+' por '+num(lv.horas)+' h.</div>'
   +'<div class="row2"><div class="fld"><label for="c-fecha">Fecha</label><input id="c-fecha" name="fecha" type="date" value="'+s.fecha+'" data-live="1" required></div><div class="fld"><label for="c-hora">Hora de inicio</label><input id="c-hora" name="hora" type="time" value="'+s.hora+'" data-live="1" required></div></div>'
   +'<div class="row2"><div class="fld"><label for="c-dur">Duración (horas)</label><input id="c-dur" name="dur" type="number" min="1" max="24" step="0.5" value="'+s.durH+'" data-live="1" required></div><div class="fld"><label for="c-eq">Equipo</label><select id="c-eq" name="eq" data-live="1">'+Object.keys(EQ).map(function(k){return'<option value="'+k+'"'+(k===eq?' selected':'')+'>'+k+' · '+EQ[k].n+'</option>'}).join('')+'</select></div></div>'
   +'<div class="fld"><span class="lb">Operarios</span><div class="checks">'+Object.keys(OPS).map(function(p){return'<label><input type="checkbox" name="op" value="'+p+'" data-live="1"'+(ops.indexOf(p)>-1?' checked':'')+'> '+OPS[p]+'</label>'}).join('')+'</div></div>'
   +'<div id="c-warn"></div>'
   +(re?'<div class="fld"><label for="c-motivo">Motivo del cambio</label><input id="c-motivo" name="motivo" placeholder="Por ejemplo: el cliente pidió adelantar el trabajo" required></div>':'')
   +'<label class="inl" style="align-items:flex-start"><input type="checkbox" name="valido" required style="margin-top:4px"><span>Una persona responsable validó la aptitud del equipo, las habilitaciones de los operarios y las condiciones de seguridad del izaje.</span></label>'
   +'</div><div class="mf"><button class="btn primary" type="submit" id="c-btn">Asignar</button></div></form>';
  modal(h);updCoord();
}
function coordVals(f){return{fecha:f.fecha.value,hora:f.hora.value,dur:parseFloat(f.dur.value)||1,eq:f.eq.value,ops:Array.prototype.slice.call(f.querySelectorAll('input[name=op]:checked')).map(function(x){return x.value})}}
function coordAvisos(sid,v){return conflicts(sid,v.eq,v.ops,v.fecha,v.hora,v.dur).concat(docWarn(v.eq,v.ops,v.fecha))}
function updCoord(){
  var f=document.getElementById('cf');if(!f)return;
  var v=coordVals(f),c=coordAvisos(modalCtx.sid,v);
  document.getElementById('c-warn').innerHTML=c.length?'<div class="callout bad"><b>Avisos antes de asignar</b><ul style="margin:6px 0 0;padding-left:18px">'+c.map(function(x){return'<li>'+esc(x)+'</li>'}).join('')+'</ul><div style="margin-top:6px">Podés asignar igual si Operaciones lo decide. Los avisos quedan en el historial.</div></div>':'<div class="callout ok">Sin avisos: no hay solapamientos y la documentación está vigente a la fecha del servicio.</div>';
  document.getElementById('c-btn').textContent=c.length?'Asignar igual (queda registrado)':(modalCtx.re?'Guardar cambios':'Asignar');
}
function submitCoord(f){
  var s=byId(modalCtx.sid),v=coordVals(f);
  if(!v.ops.length){toast('Elegí al menos un operario');return}
  var c=coordAvisos(s.id,v);
  s.fecha=v.fecha;s.hora=v.hora;s.durH=v.dur;
  s.asign={equipoId:v.eq,operarios:v.ops,validadoPor:ROLES[role].user};s.estado='coordinada';
  addHist(s,(modalCtx.re?'Reprogramado/reasignado: ':'Coordinado: ')+v.eq+' con '+v.ops.map(function(p){return OPS[p]}).join(' y ')+' para '+fd(v.fecha)+' '+v.hora+'–'+endT(s)+'.'+(c.length?' Se advirtieron '+c.length+' avisos y se asignó igual.':'')+(modalCtx.re&&f.motivo?' Motivo: '+f.motivo.value+'.':''));
  closeModal();toast(c.length?'Asignado con aviso registrado':'Coordinación guardada');render();
}

function ejecModal(sid){
  var s=byId(sid);modalCtx={f:'ejec',sid:sid};
  var h=mhead('Registrar ejecución · '+s.id)+'<form data-form="ejec"><div class="mb">'
   +'<div class="row2"><div class="fld"><label for="e-ini">Inicio real</label><input id="e-ini" name="ini" type="time" value="'+s.hora+'" required></div><div class="fld"><label for="e-fin">Fin real</label><input id="e-fin" name="fin" type="time" value="'+endT(s)+'" required></div></div>'
   +'<div class="fld"><label for="e-hs">Horas trabajadas</label><input id="e-hs" name="horas" type="number" min="0.5" max="24" step="0.5" value="'+s.durH+'" required></div>'
   +'<div class="fld"><label for="e-inc">Incidencias o cambios pedidos en obra</label><textarea id="e-inc" name="inc" placeholder="Si no hubo, dejalo vacío"></textarea></div></div>'
   +'<div class="mf"><button class="btn primary" type="submit">Guardar ejecución</button></div></form>';
  modal(h);
}
function cerrarModal(sid){
  var s=byId(sid),lv=lastV(s),cot=calc(lv.eq,lv.horas,lv.traslado,lv.mon).h;modalCtx={f:'cerrar',sid:sid};
  var h=mhead('Cerrar servicio · '+s.id)+'<form data-form="cerrar"><div class="mb">'
   +'<div class="calc"><div><span>Horas cotizadas</span><span class="num">'+num(cot)+' h</span></div><div><span>Horas realizadas</span><span class="num">'+num(s.ejec.horas)+' h</span></div><div class="tt"><span>Diferencia</span><span class="num">'+(s.ejec.horas-cot>0?'+':'')+num(s.ejec.horas-cot)+' h</span></div></div>'
   +(s.ejec.incidencia?'<div class="callout">Incidencia registrada: '+esc(s.ejec.incidencia)+'</div>':'')
   +'<div class="fld"><label for="x-ext">Extras a considerar</label><input id="x-ext" name="ext" value="'+(s.ejec.horas>cot?esc(num(s.ejec.horas-cot)+' h adicionales'):'')+'" placeholder="Horas extra, espera, materiales"></div>'
   +'<div class="fld"><label for="x-conf">Conformidad del cliente con la prestación</label><select id="x-conf" name="conf"><option>Recibida</option><option>Pendiente</option></select></div>'
   +'<div class="fld"><label for="x-obs">Observaciones</label><textarea id="x-obs" name="obs"></textarea></div>'
   +'<small class="muted">Los extras quedan separados de la cotización original. No se modifican las condiciones ya aceptadas.</small></div>'
   +'<div class="mf"><button class="btn primary" type="submit">Cerrar servicio</button></div></form>';
  modal(h);
}
function pasarModal(sid){
  var s=byId(sid),a=accepted(s);modalCtx={f:'pasar',sid:sid};
  var h=mhead('Pasar a administración · '+s.id)+'<form data-form="pasar"><div class="mb">'
   +'<dl class="kv"><dt>Cliente</dt><dd>'+esc(cl(s.cid).n)+'</dd><dt>Respaldo</dt><dd>'+(a?'Word v'+a.n+' y correo de conformidad':'<span class="chip r">Sin conformidad registrada</span>')+'</dd>'+(canMoney()&&a?'<dt>Importe aprobado</dt><dd class="num">'+money(a.total,a.mon)+'</dd>':'')+'</dl>'
   +(a?'':'<div class="callout bad">No hay conformidad registrada para ninguna versión. Podés pasarlo como excepción: Administración lo va a ver marcado.</div><div class="fld"><label for="p-exc">Motivo de la excepción</label><input id="p-exc" name="exc" required placeholder="Por ejemplo: aceptó por teléfono, falta el correo"></div>')
   +'<small class="muted">Este paso no emite facturas. Solo entrega el servicio con su respaldo para que Administración lo revise.</small></div>'
   +'<div class="mf"><button class="btn primary" type="submit">Pasar a administración</button></div></form>';
  modal(h);
}
function factModal(sid){
  var s=byId(sid);modalCtx={f:'fact',sid:sid};
  var h=mhead('Registrar factura · '+s.id)+'<form data-form="fact"><div class="mb"><div class="fld"><label for="f-ref">Referencia de la factura emitida</label><input id="f-ref" name="ref" required placeholder="Por ejemplo: A 0004-00001234"><small>La factura se emite en el sistema contable. Acá se guarda solo su referencia.</small></div><div id="f-warn"></div></div><div class="mf"><button class="btn primary" type="submit">Guardar referencia</button></div></form>';
  modal(h);
}
function exportModal(){
  var rows=[['numero','cliente','trabajo','fecha','estado','version_vigente','importe_vigente','moneda','equipo','factura']];
  visible().forEach(function(s){var lv=lastV(s);rows.push([s.id,cl(s.cid).n,s.tarea,s.fecha,SL[s.estado],lv?'v'+lv.n:'',lv?lv.total:'',lv?lv.mon:'',s.asign?s.asign.equipoId:'',s.admin?s.admin.ref:'']);});
  var csv=rows.map(function(r){return r.map(function(c){return'"'+String(c).replace(/"/g,'""')+'"'}).join(';')}).join('\n');
  var h=mhead('Exportar datos')+'<div class="mb"><p style="margin:0">Así se ve la exportación en formato legible (CSV, se abre en Excel). En el sistema real se descarga junto con los archivos adjuntos.</p><textarea class="csv" id="csvbox" readonly>'+esc(csv)+'</textarea></div><div class="mf"><button class="btn primary" type="button" data-act="copycsv">Copiar</button></div>';
  modal(h,true);
}

/* eventos */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-go],[data-open],[data-filter],[data-act],[data-route],[data-week],[data-res],[data-tab],[data-user],[data-period],[data-cli],[data-mapf],[data-agmode]');
  if(e.target.closest('#menuBtn')){sideOpen=!sideOpen;renderSide();return}
  if(e.target.id==='scrim'){sideOpen=false;renderSide();return}
  if(e.target.closest('#sres')){var gs=document.getElementById('gsearch');if(gs)gs.value='';hideSearch()}
  else if(!e.target.closest('.search'))hideSearch();
  if(e.target.id==='modal'){closeModal();return}
  if(e.target.id==='reset'){seed();filter='todos';q='';selId=null;drawerId=null;view=NAVS[role][0];render();toast('Demo reiniciada');return}
  if(!t)return;
  var d=t.dataset;
  if(d.user){var uu=USERS.filter(function(x){return x.u===d.user})[0];document.getElementById('l-u').value=uu.u;document.getElementById('l-p').value='inglobal';document.getElementById('l-err').innerHTML='';document.querySelector('.lform .btn').focus();return}
  if(d.period){period=d.period;render();return}
  if(d.mapf){mapF=d.mapf;render();return}
  if(d.agmode){agMode=d.agmode;render();return}
  if(d.cli){q=d.cli;filter='todos';go('servicios');return}
  if(typeof d.res!=='undefined'){drawerId=d.res||null;sideOpen=false;render();return}
  if(d.tab){eqTab=d.tab;resSel=null;render();return}
  if(d.go){go(d.go,{f:d.f});return}
  if(d.open){open_(d.open);return}
  if(d.filter){filter=d.filter;render();return}
  if(d.week){weekStart=addDays(weekStart,parseInt(d.week,10));render();return}
  if(d.route){var p=d.route.split(':'),ch=p[0]!==role;role=p[0];logged=true;drawerId=null;sideOpen=false;
    if(p[1]==='res'){view=isP(p[2])?'personal':'equipos';drawerId=p[2]}
    else if(p[1]==='view'){view=p[2]}
    else{selId=p[1];view='detalle'}
    render();window.scrollTo(0,0);if(ch)toast('Entraste como '+userOf(role).name+' ('+ROLES[role].n+')');return}
  var a=d.act,sid=d.sid||selId,s=sid?byId(sid):null;
  if(a==='close')closeModal();
  else if(a==='vermapa'){agMode='mapa';go('agenda')}
  else if(a==='logout'){logged=false;drawerId=null;sideOpen=false;render();window.scrollTo(0,0)}
  else if(a==='closedrawer'){drawerId=null;renderDrawer()}
  else if(a==='nuevo')quoteModal('new');
  else if(a==='cotizar')quoteModal('cotizar',sid);
  else if(a==='version')quoteModal('version',sid);
  else if(a==='doc')docModal(sid,parseInt(d.n,10));
  else if(a==='enviar'){var lv=lastV(s);lv.enviada=stamp();s.estado='enviada';addHist(s,'Cotización v'+lv.n+' enviada por correo a '+cl(s.cid).c+'.');toast('Versión '+lv.n+' marcada como enviada');render()}
  else if(a==='respuesta')respModal(sid);
  else if(a==='coordinar')coordModal(sid);
  else if(a==='ejecutar')ejecModal(sid);
  else if(a==='cerrar')cerrarModal(sid);
  else if(a==='pasar')pasarModal(sid);
  else if(a==='porfacturar'){s.admin.estado='por_facturar';addHist(s,'Autorizado para facturar.');toast('Autorizado para facturar');render()}
  else if(a==='facturado')factModal(sid);
  else if(a==='export')exportModal();
  else if(a==='renovar')renovarModal(d.rid,parseInt(d.i,10));
  else if(a==='intervencion')intervModal(d.rid);
  else if(a==='legajo')legajoModal(sid);
  else if(a==='copylegajo'){var lb=document.getElementById('lgtxt');try{navigator.clipboard.writeText(lb.value).then(function(){toast('Copiado')},function(){toast('No se pudo copiar. Abrí "Ver como texto" y copiá desde ahí.')})}catch(x){toast('No se pudo copiar. Abrí "Ver como texto" y copiá desde ahí.')}}
  else if(a==='copycsv'){var b=document.getElementById('csvbox');try{navigator.clipboard.writeText(b.value).then(function(){toast('Copiado')},function(){b.select();toast('Seleccionado: copiá con Ctrl+C')})}catch(x){b.select();toast('Seleccionado: copiá con Ctrl+C')}}
});
document.addEventListener('submit',function(e){
  var f=e.target;if(!f.dataset.form)return;e.preventDefault();
  var k=f.dataset.form,sub=e.submitter;
  if(k==='login'){
    var uu=USERS.filter(function(x){return x.u===f.u.value.trim().toLowerCase()})[0];
    if(!uu||f.p.value!=='inglobal'){document.getElementById('l-err').innerHTML='<div class="lerr">Usuario o contraseña incorrectos. Tocá un usuario de prueba para completar.</div>';return}
    role=uu.role;logged=true;view=NAVS[role][0];selId=null;drawerId=null;filter='todos';q='';render();window.scrollTo(0,0);return;
  }
  if(k==='quote')submitQuote(f,sub);
  else if(k==='resp')submitResp(f);
  else if(k==='coord')submitCoord(f);
  else if(k==='ejec'){var s=byId(modalCtx.sid);s.ejec={ini:f.ini.value,fin:f.fin.value,horas:parseFloat(f.horas.value)||0,incidencia:f.inc.value};s.estado='ejecutada';addHist(s,'Ejecución registrada: '+num(s.ejec.horas)+' h. '+(f.inc.value?'Incidencia: '+f.inc.value:'Sin incidencias.'));closeModal();toast('Ejecución guardada. Pasa a Operaciones para el cierre.');render()}
  else if(k==='cerrar'){var s2=byId(modalCtx.sid),lv2=lastV(s2),cot=calc(lv2.eq,lv2.horas,lv2.traslado,lv2.mon).h;s2.cierre={horas:s2.ejec.horas,extras:f.ext.value,obs:f.obs.value,conf:f.conf.value};s2.estado='cerrada';addHist(s2,'Servicio cerrado. Realizado '+num(s2.ejec.horas)+' h frente a '+num(cot)+' h cotizadas. Conformidad de prestación: '+f.conf.value.toLowerCase()+'.');closeModal();toast('Servicio cerrado');render()}
  else if(k==='pasar'){var s3=byId(modalCtx.sid);s3.admin={estado:'pendiente',ref:''};s3.estado='pendiente_admin';if(f.exc){s3.excepcion=f.exc.value}addHist(s3,'Pasado a administración'+(f.exc?' como excepción: '+f.exc.value:' con su respaldo')+'.');closeModal();toast('Enviado a Administración');render()}
  else if(k==='renovar')submitRenovar(f);
  else if(k==='interv')submitInterv(f);
  else if(k==='fact'){var s4=byId(modalCtx.sid);s4.admin.estado='facturado';s4.admin.ref=f.ref.value;addHist(s4,'Factura registrada: '+f.ref.value+'.');closeModal();toast('Referencia guardada');render()}
});
document.addEventListener('input',function(e){
  if(e.target.id==='gsearch'){updSearch();return}
  if(e.target.id==='search'){q=e.target.value;render();return}
  if(e.target.closest('#modal')){
    if(modalCtx&&modalCtx.f==='quote'&&e.target.closest('[data-live],#qf'))updQuote();
    if(modalCtx&&modalCtx.f==='coord')updCoord();
    if(modalCtx&&modalCtx.f==='fact'&&e.target.name==='ref'){
      var r=e.target.value.trim().toLowerCase(),dup=r&&S.filter(function(x){return x.admin&&x.admin.ref&&x.admin.ref.toLowerCase()===r&&x.id!==modalCtx.sid})[0];
      document.getElementById('f-warn').innerHTML=dup?'<div class="callout">Esa referencia ya figura en '+dup.id+'. Si es una factura para varios servicios, podés guardarla igual.</div>':'';
    }
  }
});
document.addEventListener('change',function(e){
  if(!e.target.closest('#modal')||!modalCtx)return;
  if(modalCtx.f==='quote'){
    if(e.target.id==='q-cliente'){var ct=document.getElementById('q-contacto');if(ct)ct.value=cl(e.target.value).c}
    updQuote();
  }
  if(modalCtx.f==='coord'){
    if(e.target.id==='c-eq'&&!modalCtx.re){Array.prototype.forEach.call(document.querySelectorAll('#cf input[name=op]'),function(x){x.checked=x.value===EQ[e.target.value].op})}
    updCoord();
  }
  if(modalCtx.f==='legajo'&&e.target.dataset.inc){modalCtx.inc[e.target.dataset.inc]=e.target.checked;updLegajo()}
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  if(!document.getElementById('modal').hidden){closeModal();return}
  var sr=document.getElementById('sres');if(sr&&!sr.hidden){hideSearch();return}
  if(drawerId){drawerId=null;renderDrawer();return}
  if(sideOpen){sideOpen=false;renderSide()}
});


seed();render();
})();
</script>
